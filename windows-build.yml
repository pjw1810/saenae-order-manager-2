\
        name: Build Order Manager installer

        on:
          workflow_dispatch:
          push:
            branches:
              - main

        permissions:
          contents: read

        jobs:
          build:
            runs-on: windows-latest
            steps:
              - name: Checkout source
                uses: actions/checkout@v4

              - name: Set up Python
                uses: actions/setup-python@v5
                with:
                  python-version: "3.11"

              - name: Install dependencies
                shell: pwsh
                run: |
                  python -m pip install --upgrade pip
                  python -m pip install -r requirements.txt
                  python -m pip install pyinstaller==6.11.1

              - name: Build application
                shell: pwsh
                run: |
                  python -m PyInstaller --noconfirm --clean --windowed --name SaenaeOrderManager --icon app.ico --collect-all PySide6 --collect-all flask --collect-all openpyxl app.py

              - name: Install NSIS
                shell: pwsh
                run: |
                  choco install nsis --no-progress -y --force
                  if ($LASTEXITCODE -ne 0) {
                    throw "Chocolatey could not install NSIS (exit code $LASTEXITCODE)."
                  }

                  $roots = @(
                    "$env:ProgramFiles\NSIS",
                    "${env:ProgramFiles(x86)}\NSIS",
                    "$env:ChocolateyInstall\lib\nsis",
                    "$env:ChocolateyInstall\bin"
                  ) | Where-Object { $_ -and (Test-Path $_) }

                  $makensis = $null
                  foreach ($root in $roots) {
                    $candidate = Join-Path $root "makensis.exe"
                    if (Test-Path $candidate) {
                      $makensis = $candidate
                      break
                    }
                    $found = Get-ChildItem -Path $root -Filter makensis.exe -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1
                    if ($found) {
                      $makensis = $found.FullName
                      break
                    }
                  }

                  if (-not $makensis) {
                    $cmd = Get-Command makensis.exe -ErrorAction SilentlyContinue
                    if ($cmd) { $makensis = $cmd.Source }
                  }

                  if (-not $makensis) {
                    choco list --local-only
                    throw "NSIS installation finished, but makensis.exe was not found. Check the NSIS install log above."
                  }

                  "NSIS_EXE=$makensis" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
                  Write-Host "NSIS found: $makensis"

              - name: Build Setup.exe
                shell: pwsh
                run: |
                  if (-not $env:NSIS_EXE -or -not (Test-Path $env:NSIS_EXE)) {
                    throw "NSIS_EXE is missing or does not exist: '$env:NSIS_EXE'"
                  }
                  & $env:NSIS_EXE /V3 installer.nsi
                  if ($LASTEXITCODE -ne 0) {
                    throw "NSIS build failed with exit code $LASTEXITCODE"
                  }
                  if (-not (Test-Path "OrderManager_Setup.exe")) {
                    throw "Installer was not created: OrderManager_Setup.exe"
                  }

              - name: Upload build artifacts
                uses: actions/upload-artifact@v4
                with:
                  name: OrderManager-Windows-Installer
                  path: OrderManager_Setup.exe
                  if-no-files-found: error
                  retention-days: 30

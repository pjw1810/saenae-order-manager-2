name: Build Order Manager installer

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.11.1

      - name: Build application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name SaenaeOrderManager --icon app.ico --collect-all PySide6 --collect-all flask --collect-all openpyxl app.py

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress -y

      - name: Build Setup.exe
        shell: pwsh
        run: |
          $nsisCandidates = @(
            (Join-Path ${env:ProgramFiles(x86)} "NSIS\makensis.exe"),
            (Join-Path $env:ProgramFiles "NSIS\makensis.exe"),
            (Join-Path $env:ChocolateyInstall "lib\nsis\tools\makensis.exe")
          )

          $nsis = $null
          foreach ($candidate in $nsisCandidates) {
            if ($candidate -and (Test-Path $candidate)) {
              $nsis = $candidate
              break
            }
          }

          if (-not $nsis) {
            $command = Get-Command makensis.exe -ErrorAction SilentlyContinue
            if ($command) {
              $nsis = $command.Source
            }
          }

          if (-not $nsis) {
            $roots = @(
              ${env:ProgramFiles(x86)},
              $env:ProgramFiles,
              $env:ChocolateyInstall
            ) | Where-Object { $_ -and (Test-Path $_) }

            foreach ($root in $roots) {
              $found = Get-ChildItem -Path $root -Filter makensis.exe -Recurse -ErrorAction SilentlyContinue |
                Select-Object -First 1
              if ($found) {
                $nsis = $found.FullName
                break
              }
            }
          }

          if (-not $nsis) {
            throw "NSIS makensis.exe not found. NSIS installation did not create the expected executable."
          }

          Write-Host "Using NSIS: $nsis"
          & $nsis installer.nsi
          if ($LASTEXITCODE -ne 0) {
            throw "NSIS build failed with exit code $LASTEXITCODE"
          }
          if (-not (Test-Path "OrderManager_Setup.exe")) {
            throw "Installer was not created"
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrderManager-Windows-Installer
          path: OrderManager_Setup.exe
          if-no-files-found: error
          retention-days: 30

name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.11.1

      - name: Build application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name SaenaeOrderManager --collect-all PySide6 --collect-all flask --collect-all openpyxl app.py

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress -y

      - name: Build Setup.exe
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ProgramFiles(x86)\\NSIS\\makensis.exe",
            "$env:ProgramFiles\\NSIS\\makensis.exe"
          )
          $nsis = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $nsis) {
            $cmd = Get-Command makensis.exe -ErrorAction SilentlyContinue
            if ($cmd) { $nsis = $cmd.Source }
          }
          if (-not $nsis) { throw "NSIS makensis.exe not found" }
          & $nsis installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "NSIS build failed" }
          if (!(Test-Path "SaenaeOrderManager_Setup.exe")) { throw "Installer was not created" }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SaenaeOrderManager-Windows-Installer
          path: SaenaeOrderManager_Setup.exe
          if-no-files-found: error
          retention-days: 30

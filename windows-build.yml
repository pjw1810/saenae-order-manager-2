name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python (build machine only)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.11.1

      - name: Build application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name SaenaeOrderManager --collect-all PySide6 --collect-all flask --collect-all openpyxl app.py

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress -y

      - name: Build Setup.exe
        shell: pwsh
        run: |
          & "$env:ProgramFiles(x86)\\NSIS\\makensis.exe" installer.nsi
          if (!(Test-Path "SaenaeOrderManager_Setup.exe")) { throw "Installer was not created" }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SaenaeOrderManager-Windows-Installer
          path: |
            SaenaeOrderManager_Setup.exe
            dist/SaenaeOrderManager/SaenaeOrderManager.exe
          retention-days: 30

      - name: Publish release for version tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: SaenaeOrderManager_Setup.exe
          generate_release_notes: true

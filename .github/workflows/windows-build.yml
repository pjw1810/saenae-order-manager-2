
name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python (build machine only)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build application
        run: |
          pyinstaller --noconfirm --windowed --name SaenaeOrderManager app.py

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress

      - name: Build Setup.exe
        shell: pwsh
        run: |
          $paths = @(
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
            "$env:ProgramFiles\NSIS\makensis.exe"
          )

          $nsis = $null

          foreach ($path in $paths) {
            if (Test-Path $path) {
              $nsis = $path
              break
            }
          }

          if (!$nsis) {
            $found = Get-ChildItem `
              -Path $env:ProgramFiles, ${env:ProgramFiles(x86)} `
              -Filter makensis.exe `
              -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if ($found) {
              $nsis = $found.FullName
            }
          }

          if (!$nsis) {
            throw "NSIS makensis.exe not found"
          }

          & $nsis installer.nsi

          if ($LASTEXITCODE -ne 0) {
            throw "NSIS build failed"
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SaenaeOrderManager-Windows-Installer
          path: |
            SaenaeOrderManager_Setup.exe
            dist/SaenaeOrderManager/
          if-no-files-found: error
          retention-days: 30
